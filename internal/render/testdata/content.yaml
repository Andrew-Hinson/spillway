# Generated by the Spillway renderer from LogPipeline specs. Do not edit.
api:
  address: 0.0.0.0:8686
  enabled: true
data_dir: /vector-data-dir
log_schema:
  timestamp_key: _timestamp
sinks:
  cold_s3:
    acknowledgements:
      enabled: true
    batch:
      max_bytes: 10485760
      timeout_secs: 60
    bucket: spillway-cold
    buffer:
      max_size: 536870912
      type: disk
      when_full: block
    compression: gzip
    encoding:
      codec: json
    endpoint: http://minio.storage.svc:9000
    force_path_style: true
    framing:
      method: newline_delimited
    inputs:
    - content_in_wikimedia
    key_prefix: team={{ spillway.team }}/date=%Y-%m-%d/
    region: us-east-1
    type: aws_s3
  hot_loki:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 1073741824
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - content_hot
    labels:
      source: '{{ spillway.source }}'
      team: '{{ spillway.team }}'
    out_of_order_action: accept
    type: loki
  loki_pods:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 536870912
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - pod_logs
    labels:
      container: '{{ container }}'
      namespace: '{{ namespace }}'
      pod: '{{ pod }}'
    out_of_order_action: accept
    remove_label_fields: true
    type: loki
  prometheus:
    address: 0.0.0.0:9598
    buckets:
    - 1
    - 2.5
    - 5
    - 10
    - 15
    - 20
    - 30
    - 50
    - 75
    - 100
    - 150
    - 250
    - 500
    - 1000
    - 2500
    - 5000
    - 10000
    - 30000
    - 60000
    inputs:
    - internal_metrics
    - team_latency_metrics
    type: prometheus_exporter
sources:
  agents:
    address: 0.0.0.0:6000
    type: vector
  content_src_wikimedia:
    auto_offset_reset: latest
    bootstrap_servers: spillway-kafka-bootstrap.kafka.svc:9092
    decoding:
      codec: json
    group_id: spillway-content-wikimedia
    headers_key: ""
    key_field: ""
    metrics:
      topic_lag_metric: true
    offset_key: ""
    partition_key: ""
    topic_key: ""
    topics:
    - wikimedia.recentchange
    type: kafka
  internal_metrics:
    scrape_interval_secs: 15
    type: internal_metrics
transforms:
  content_budget:
    inputs:
    - content_in_wikimedia
    threshold: 100
    type: throttle
    window_secs: 1
  content_hot:
    inputs:
    - content_budget
    source: |
      sink_at = now()
      .spillway.sink_at = sink_at
      produced_at, err = parse_timestamp(.spillway.produced_at, "%+")
      if err == null {
        .spillway.pipeline_latency_ms = to_unix_timestamp(sink_at, unit: "milliseconds") -
          to_unix_timestamp(produced_at, unit: "milliseconds")
      }
    type: remap
  content_in_wikimedia:
    inputs:
    - content_src_wikimedia
    source: |
      del(.source_type)
      .spillway.team = "content"
      .spillway.source = "wikimedia"
    type: remap
  pod_logs:
    inputs:
    - agents
    source: |
      k = object(.kubernetes) ?? {}
      . = {
        "_timestamp": ._timestamp,
        "message": .message,
        "stream": .stream,
        "node": k.pod_node_name,
        "namespace": k.pod_namespace,
        "pod": k.pod_name,
        "container": k.container_name
      }
    type: remap
  team_latency_events:
    condition: exists(.spillway.pipeline_latency_ms)
    inputs:
    - content_hot
    type: filter
  team_latency_metrics:
    inputs:
    - team_latency_events
    metrics:
    - field: spillway.pipeline_latency_ms
      name: pipeline_latency_milliseconds
      namespace: spillway
      tags:
        team: '{{ spillway.team }}'
      type: histogram
    type: log_to_metric
