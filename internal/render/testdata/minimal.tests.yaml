    type: vrl
  name: unclaimed_pods drops pod logs from search, claimed by a team
  no_outputs_from:
  - unclaimed_pods
- inputs:
  - insert_at: unclaimed_pods
    source: '. = {"message": "hello", "stream": "stdout", "kubernetes": {"pod_namespace":
