# Generated by the Spillway renderer: `vector test` cases for every transform in the matching config. Do not edit.
tests:
- inputs:
  - insert_at: search_src_pods
    source: '. = {"message": "hello", "stream": "stdout", "kubernetes": {"pod_namespace":
      "search", "pod_name": "app-0", "container_name": "app", "pod_node_name": "node-1",
      "pod_ip": "10.0.0.1", "pod_labels": {"app": "x"}}}'
    type: vrl
  name: search_src_pods passes pod logs from search
  outputs:
  - conditions:
    - source: |
        assert_eq!(.kubernetes.pod_namespace, "search")
      type: vrl
    extract_from: search_src_pods
- inputs:
  - insert_at: search_src_pods
    source: '. = {"message": "hello", "stream": "stdout", "kubernetes": {"pod_namespace":
      "not-claimed", "pod_name": "app-0", "container_name": "app", "pod_node_name":
      "node-1", "pod_ip": "10.0.0.1", "pod_labels": {"app": "x"}}}'
    type: vrl
  name: search_src_pods drops pod logs from other namespaces
  no_outputs_from:
  - search_src_pods
- inputs:
  - insert_at: search_in_pods
    source: '. = {"message": "hello", "stream": "stdout", "kubernetes": {"pod_namespace":
      "search", "pod_name": "app-0", "container_name": "app", "pod_node_name": "node-1",
      "pod_ip": "10.0.0.1", "pod_labels": {"app": "x"}}}'
    type: vrl
  name: search_in_pods reshapes pod logs and tags them with team and source
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "hello")
        assert_eq!(.stream, "stdout")
        assert_eq!(.namespace, "search")
        assert_eq!(.pod, "app-0")
        assert_eq!(.container, "app")
        assert_eq!(.node, "node-1")
        assert!(!exists(.kubernetes))
        assert_eq!(.spillway.team, "search")
        assert_eq!(.spillway.source, "pods")
      type: vrl
    extract_from: search_in_pods
- inputs:
  - insert_at: search_hot
    source: '. = {"source_type": "kafka", "spillway": {"event_id": "e1", "produced_at":
      "2026-01-01T00:00:00.123456789Z", "feeder": "wikimedia"}}'
    type: vrl
  name: search_hot stamps sink time and pipeline latency
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(int!(.spillway.pipeline_latency_ms) > 0)
        assert_eq!(.spillway.event_id, "e1")
      type: vrl
    extract_from: search_hot
- inputs:
  - insert_at: search_hot
    source: '. = {"message": "m"}'
    type: vrl
  name: search_hot tolerates events without a produce timestamp
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(!exists(.spillway.pipeline_latency_ms))
      type: vrl
    extract_from: search_hot
