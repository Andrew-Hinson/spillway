# Generated by the Spillway renderer from LogPipeline specs. Do not edit.
api:
  address: 0.0.0.0:8686
  enabled: true
data_dir: /vector-data-dir
log_schema:
  timestamp_key: _timestamp
sinks:
  hot_loki:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 1073741824
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - search_hot
    labels:
      source: '{{ spillway.source }}'
      team: '{{ spillway.team }}'
    out_of_order_action: accept
    type: loki
  loki:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 1073741824
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - stamp
    labels:
      feeder: '{{ spillway.feeder }}'
      type: '{{ type }}'
    out_of_order_action: accept
    type: loki
  loki_pods:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 536870912
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - redact_pods
    labels:
      container: '{{ container }}'
      namespace: '{{ namespace }}'
      pod: '{{ pod }}'
    out_of_order_action: accept
    remove_label_fields: true
    type: loki
  prometheus:
    address: 0.0.0.0:9598
    buckets:
    - 1
    - 2.5
    - 5
    - 10
    - 15
    - 20
    - 30
    - 50
    - 75
    - 100
    - 150
    - 250
    - 500
    - 1000
    - 2500
    - 5000
    - 10000
    - 30000
    - 60000
    inputs:
    - metrics_by_team
    - latency_metrics
    - team_latency_metrics
    type: prometheus_exporter
sources:
  agents:
    auto_offset_reset: earliest
    bootstrap_servers: spillway-kafka-bootstrap.kafka.svc:9092
    decoding:
      codec: json
    group_id: spillway-pods
    headers_key: ""
    key_field: ""
    metrics:
      topic_lag_metric: true
    offset_key: ""
    partition_key: ""
    topic_key: ""
    topics:
    - spillway.pods
    type: kafka
  internal_metrics:
    scrape_interval_secs: 15
    type: internal_metrics
  wikimedia:
    auto_offset_reset: earliest
    bootstrap_servers: spillway-kafka-bootstrap.kafka.svc:9092
    decoding:
      codec: json
    group_id: spillway-aggregator
    headers_key: ""
    key_field: ""
    metrics:
      topic_lag_metric: true
    offset_key: ""
    partition_key: ""
    topic_key: ""
    topics:
    - wikimedia.recentchange
    type: kafka
transforms:
  latency_metrics:
    inputs:
    - stamp
    metrics:
    - field: spillway.pipeline_latency_ms
      name: pipeline_latency_milliseconds
      namespace: spillway
      tags:
        feeder: '{{ spillway.feeder }}'
      type: histogram
    type: log_to_metric
  metrics_by_team:
    inputs:
    - internal_metrics
    source: |
      found = parse_regex(string(.tags.component_id) ?? "", r'^(?P<team>[a-z0-9-]+)_(?:src_.+|in_.+|ids|dedupe|redact|cold|sample|budget|hot)$') ?? {}
      if includes(["search"], found.team) { .tags.team = found.team }
    type: remap
  pod_logs:
    inputs:
    - unclaimed_pods
    source: |
      k = object(.kubernetes) ?? {}
      ts = ._timestamp
      if is_string(ts) { ts = parse_timestamp(string!(ts), "%+") ?? ts }
      line = to_string(.message) ?? ""
      fields = {}
      if starts_with(line, "{") {
        fields = object(parse_json(line) ?? null) ?? {}
      }
      stamp = {}
      level = null
      if length(fields) > 0 {
        if exists(fields._timestamp) { fields.app__timestamp = del(fields._timestamp) }
        if exists(fields.stream) { fields.app_stream = del(fields.stream) }
        if exists(fields.node) { fields.app_node = del(fields.node) }
        if exists(fields.namespace) { fields.app_namespace = del(fields.namespace) }
        if exists(fields.pod) { fields.app_pod = del(fields.pod) }
        if exists(fields.container) { fields.app_container = del(fields.container) }
        sp = del(fields.spillway)
        if sp != null && !is_object(sp) {
          fields.app_spillway = sp
          sp = {}
        }
        sp = object(sp) ?? {}
        id = string(sp.event_id) ?? ""
        if match(id, r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
          stamp.event_id = id
          del(sp.event_id)
        }
        produced_at, err = parse_timestamp(string(sp.produced_at) ?? "", "%+")
        if err == null {
          stamp.produced_at = format_timestamp!(produced_at, "%+")
          del(sp.produced_at)
        }
        feeder = string(sp.feeder) ?? ""
        if match(feeder, r'^[a-z]{1,16}(-[a-z]{1,16})?$') {
          stamp.feeder = feeder
          del(sp.feeder)
        }
        fixture_id = int(sp.fixture.id) ?? null
        fixture_pattern = string(sp.fixture.pattern) ?? ""
        if fixture_id != null && length(object(sp.fixture) ?? {}) == 2 && includes(["ssn", "email", "phone", "memberId"], fixture_pattern) {
          stamp.fixture = {"id": fixture_id, "pattern": fixture_pattern}
          del(sp.fixture)
        }
        if length(sp) > 0 { fields.app_spillway = sp }
        level = fields.level
        if level == null { level = fields.lvl }
        if level == null { level = fields.severity }
      } else {
        fields.message = .message
        found = parse_regex(line, r'^(?P<level>[IWEF])\d{4} ') ??
          parse_regex(line, r'^(?:\d\S*\s+){0,2}\[?(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)\]?(?:\s|$)') ??
          parse_regex(line, r'(?:^|\s)(?:level|lvl)="?(?P<level>[A-Za-z]+)') ??
          {}
        level = found.level
      }
      level = downcase(to_string(level) ?? "")
      aliases = {
        "i": "info", "w": "warn", "e": "error", "f": "fatal",
        "warning": "warn", "err": "error", "eror": "error", "dbug": "debug", "crit": "critical",
        "10": "trace", "20": "debug", "30": "info", "40": "warn", "50": "error", "60": "fatal"
      }
      level = string(get(aliases, [level]) ?? null) ?? level
      if match(level, r'^[a-z]{1,16}$') { fields.level = level }
      . = merge(fields, {
        "_timestamp": ts,
        "stream": .stream,
        "node": k.pod_node_name,
        "namespace": k.pod_namespace,
        "pod": k.pod_name,
        "container": k.container_name
      })
      if length(stamp) > 0 { .spillway = stamp }
    type: remap
  redact_feed:
    inputs:
    - wikimedia
    source: |
      # Redact every string in the event except Spillway's own metadata.
      meta = .spillway
      . = redact(., filters: [r'[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}.-]+\.\p{L}{2,}', r'MBR-\d{8}', r'(?:\+1[ .-]?)?(?:\(\d{3}\) ?|\d{3}[ .-])\d{3}[ .-]\d{4}', r'\d{3}-\d{2}-\d{4}'])
      if meta != null { .spillway = meta }
    type: remap
  redact_pods:
    inputs:
    - pod_logs
    source: |
      # Redact every string in the event except Spillway's own metadata.
      meta = .spillway
      . = redact(., filters: [r'[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}.-]+\.\p{L}{2,}', r'MBR-\d{8}', r'(?:\+1[ .-]?)?(?:\(\d{3}\) ?|\d{3}[ .-])\d{3}[ .-]\d{4}', r'\d{3}-\d{2}-\d{4}'])
      if meta != null { .spillway = meta }
    type: remap
  search_dedupe:
    cache:
      num_events: 10000
    fields:
      match:
      - spillway.event_id
    inputs:
    - search_ids.with_id
    type: dedupe
  search_hot:
    inputs:
    - search_redact
    source: |
      sink_at = now()
      .spillway.sink_at = sink_at
      produced_at, err = parse_timestamp(.spillway.produced_at, "%+")
      if err == null {
        .spillway.pipeline_latency_ms = to_unix_timestamp(sink_at, unit: "milliseconds") -
          to_unix_timestamp(produced_at, unit: "milliseconds")
      }
    type: remap
  search_ids:
    inputs:
    - search_in_pods
    route:
      with_id: is_string(.spillway.event_id)
    type: route
  search_in_pods:
    inputs:
    - search_src_pods
    source: |
      k = object(.kubernetes) ?? {}
      ts = ._timestamp
      if is_string(ts) { ts = parse_timestamp(string!(ts), "%+") ?? ts }
      line = to_string(.message) ?? ""
