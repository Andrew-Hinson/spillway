# Generated by the Spillway renderer from LogPipeline specs. Do not edit.
api:
  address: 0.0.0.0:8686
  enabled: true
data_dir: /vector-data-dir
log_schema:
  timestamp_key: _timestamp
sinks:
  hot_loki:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 1073741824
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - search_hot
    labels:
      source: '{{ spillway.source }}'
      team: '{{ spillway.team }}'
    out_of_order_action: accept
    type: loki
  loki:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 1073741824
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - stamp
    labels:
      feeder: '{{ spillway.feeder }}'
      type: '{{ type }}'
    out_of_order_action: accept
    type: loki
  loki_pods:
    acknowledgements:
      enabled: true
    batch:
      timeout_secs: 1
    buffer:
      max_size: 536870912
      type: disk
      when_full: block
    encoding:
      codec: json
    endpoint: http://loki.observability.svc:3100
    inputs:
    - redact_pods
    labels:
      container: '{{ container }}'
      namespace: '{{ namespace }}'
      pod: '{{ pod }}'
    out_of_order_action: accept
    remove_label_fields: true
    type: loki
  prometheus:
    address: 0.0.0.0:9598
    buckets:
    - 1
    - 2.5
    - 5
    - 10
    - 15
    - 20
    - 30
    - 50
    - 75
    - 100
    - 150
    - 250
    - 500
    - 1000
    - 2500
    - 5000
    - 10000
    - 30000
    - 60000
    inputs:
    - internal_metrics
    - latency_metrics
    - team_latency_metrics
    type: prometheus_exporter
sources:
  agents:
    address: 0.0.0.0:6000
    type: vector
  internal_metrics:
    scrape_interval_secs: 15
    type: internal_metrics
  wikimedia:
    auto_offset_reset: earliest
    bootstrap_servers: spillway-kafka-bootstrap.kafka.svc:9092
    decoding:
      codec: json
    group_id: spillway-aggregator
    headers_key: ""
    key_field: ""
    metrics:
      topic_lag_metric: true
    offset_key: ""
    partition_key: ""
    topic_key: ""
    topics:
    - wikimedia.recentchange
    type: kafka
transforms:
  latency_metrics:
    inputs:
    - stamp
    metrics:
    - field: spillway.pipeline_latency_ms
      name: pipeline_latency_milliseconds
      namespace: spillway
      tags:
        feeder: '{{ spillway.feeder }}'
      type: histogram
    type: log_to_metric
  pod_logs:
    inputs:
    - unclaimed_pods
    source: |
      k = object(.kubernetes) ?? {}
      . = {
        "_timestamp": ._timestamp,
        "message": .message,
        "stream": .stream,
        "node": k.pod_node_name,
        "namespace": k.pod_namespace,
        "pod": k.pod_name,
        "container": k.container_name
      }
    type: remap
  redact_feed:
    inputs:
    - wikimedia
    source: |
      # Redact every string in the event except Spillway's own metadata.
      meta = .spillway
      . = redact(., filters: [r'[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}.-]+\.\p{L}{2,}', r'MBR-\d{8}', r'(?:\+1[ .-]?)?(?:\(\d{3}\) ?|\d{3}[ .-])\d{3}[ .-]\d{4}', r'\d{3}-\d{2}-\d{4}'])
      if meta != null { .spillway = meta }
    type: remap
  redact_pods:
    inputs:
    - pod_logs
    source: |
      # Redact every string in the event except Spillway's own metadata.
      meta = .spillway
      . = redact(., filters: [r'[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}.-]+\.\p{L}{2,}', r'MBR-\d{8}', r'(?:\+1[ .-]?)?(?:\(\d{3}\) ?|\d{3}[ .-])\d{3}[ .-]\d{4}', r'\d{3}-\d{2}-\d{4}'])
      if meta != null { .spillway = meta }
    type: remap
  search_hot:
    inputs:
    - search_redact
    source: |
      sink_at = now()
      .spillway.sink_at = sink_at
      produced_at, err = parse_timestamp(.spillway.produced_at, "%+")
      if err == null {
        .spillway.pipeline_latency_ms = to_unix_timestamp(sink_at, unit: "milliseconds") -
          to_unix_timestamp(produced_at, unit: "milliseconds")
      }
    type: remap
  search_in_pods:
    inputs:
    - search_src_pods
    source: |
      k = object(.kubernetes) ?? {}
      . = {
        "_timestamp": ._timestamp,
        "message": .message,
        "stream": .stream,
        "node": k.pod_node_name,
        "namespace": k.pod_namespace,
        "pod": k.pod_name,
        "container": k.container_name
      }
      .spillway = {"team": "search", "source": "pods"}
    type: remap
  search_redact:
    inputs:
    - search_in_pods
    source: |
      # Redact every string in the event except Spillway's own metadata.
      meta = .spillway
      . = redact(., filters: [r'[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}.-]+\.\p{L}{2,}', r'MBR-\d{8}', r'(?:\+1[ .-]?)?(?:\(\d{3}\) ?|\d{3}[ .-])\d{3}[ .-]\d{4}', r'\d{3}-\d{2}-\d{4}'])
      if meta != null { .spillway = meta }
    type: remap
  search_src_pods:
    condition: includes(["search"], .kubernetes.pod_namespace)
    inputs:
    - agents
    type: filter
  stamp:
    inputs:
    - redact_feed
    source: |
      del(.source_type)
      sink_at = now()
      .spillway.sink_at = sink_at
      produced_at, err = parse_timestamp(.spillway.produced_at, "%+")
      if err == null {
        .spillway.pipeline_latency_ms = to_unix_timestamp(sink_at, unit: "milliseconds") -
          to_unix_timestamp(produced_at, unit: "milliseconds")
      }
    type: remap
  team_latency_events:
    condition: exists(.spillway.pipeline_latency_ms)
    inputs:
    - search_hot
    type: filter
  team_latency_metrics:
    inputs:
    - team_latency_events
    metrics:
    - field: spillway.pipeline_latency_ms
      name: pipeline_latency_milliseconds
      namespace: spillway
      tags:
        team: '{{ spillway.team }}'
      type: histogram
    type: log_to_metric
  unclaimed_pods:
    condition: '!includes(["search"], .kubernetes.pod_namespace)'
    inputs:
    - agents
    type: filter
