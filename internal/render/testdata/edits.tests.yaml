    source: '. = {"message": "2026-10-09T12:34:56.789Z rev 1234567890 from 10.0.0.1
      v1.24.3 user@localhost MBR-1234567 pod app-5d8f9-x2x7q", "spillway": {"team":
      "t"}}'
    type: vrl
  name: edits_redact leaves values that only look like PII
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "2026-10-09T12:34:56.789Z rev 1234567890 from 10.0.0.1 v1.24.3 user@localhost MBR-1234567 pod app-5d8f9-x2x7q")
      type: vrl
    extract_from: edits_redact
- inputs:
  - insert_at: edits_sample
    source: '. = set!(value: {"message": "m"}, path: ["type"], data: "CATEGORIZE")'
    type: vrl
  name: edits_sample drops every categorize event (0%)
  no_outputs_from:
  - edits_sample
- inputs:
  - insert_at: edits_sample
    source: '. = set!(value: {"message": "m"}, path: ["type"], data: "UNLISTED")'
    type: vrl
  name: edits_sample keeps levels it doesn't list
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "m")
      type: vrl
    extract_from: edits_sample
- inputs:
  - insert_at: edits_sample
