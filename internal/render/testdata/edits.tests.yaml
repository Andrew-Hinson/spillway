# Generated by the Spillway renderer: `vector test` cases for every transform in the matching config. Do not edit.
tests:
- inputs:
  - insert_at: edits_in_recentchange
    source: '. = {"title": "x", "source_type": "kafka", "spillway": {"event_id": "e1",
      "feeder": "wikimedia"}}'
    type: vrl
  name: edits_in_recentchange tags events with team and source
  outputs:
  - conditions:
    - source: |
        assert_eq!(.spillway.team, "edits")
        assert_eq!(.spillway.source, "recentchange")
        assert_eq!(.spillway.event_id, "e1")
        assert_eq!(.title, "x")
        assert!(!exists(.source_type))
      type: vrl
    extract_from: edits_in_recentchange
- inputs:
  - insert_at: edits_ids
    source: '. = {"message": "m", "spillway": {"event_id": "e1"}}'
    type: vrl
  name: edits_ids sends events with an ID to dedupe
  outputs:
  - conditions:
    - source: |
        assert_eq!(.spillway.event_id, "e1")
      type: vrl
    extract_from: edits_ids.with_id
- inputs:
  - insert_at: edits_ids
    source: '. = {"message": "m"}'
    type: vrl
  name: edits_ids sends no event without an ID to dedupe
  no_outputs_from:
  - edits_ids.with_id
- inputs:
  - insert_at: edits_ids
    source: '. = {"message": "m"}'
    type: vrl
  name: edits_ids sends events without an ID around dedupe
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "m")
      type: vrl
    extract_from: edits_ids._unmatched
- inputs:
  - insert_at: edits_dedupe
    source: '. = {"message": "first", "spillway": {"event_id": "e1"}}'
    type: vrl
  name: edits_dedupe passes the first copy of an event ID
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "first")
      type: vrl
    extract_from: edits_dedupe
- inputs:
  - insert_at: edits_redact
    source: '. = {"message": "contact: jo.doe@example.com", "detail": {"note": "jo.doe@example.com"},
      "spillway": {"team": "t", "event_id": "jo.doe@example.com"}}'
    type: vrl
  name: edits_redact masks email
  outputs:
  - conditions:
    - source: |
        assert!(!contains(string!(.message), "jo.doe@example.com"), message: string!(.message))
        assert!(!contains(string!(.detail.note), "jo.doe@example.com"), message: string!(.detail.note))
        assert!(starts_with(string!(.message), "contact: "))
        assert_eq!(.spillway.event_id, "jo.doe@example.com")
      type: vrl
    extract_from: edits_redact
