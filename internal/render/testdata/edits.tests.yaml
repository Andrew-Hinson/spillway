- inputs:
  - insert_at: edits_hot
    source: '. = {"source_type": "kafka", "spillway": {"event_id": "e1", "produced_at":
      "2026-01-01T00:00:00.123456789Z", "feeder": "wikimedia"}}'
    type: vrl
  name: edits_hot stamps sink time and pipeline latency
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(int!(.spillway.pipeline_latency_ms) > 0)
        assert_eq!(.spillway.event_id, "e1")
      type: vrl
    extract_from: edits_hot
- inputs:
