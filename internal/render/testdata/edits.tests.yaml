  name: edits_hot tolerates events without a produce timestamp
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(!exists(.spillway.pipeline_latency_ms))
      type: vrl
    extract_from: edits_hot
