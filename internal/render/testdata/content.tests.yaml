# Generated by the Spillway renderer: `vector test` cases for every transform in the matching config. Do not edit.
tests:
- inputs:
  - insert_at: content_in_wikimedia
    source: '. = {"title": "x", "source_type": "kafka", "spillway": {"event_id": "e1",
      "feeder": "wikimedia"}}'
    type: vrl
  name: content_in_wikimedia tags events with team and source
  outputs:
  - conditions:
    - source: |
        assert_eq!(.spillway.team, "content")
        assert_eq!(.spillway.source, "wikimedia")
        assert_eq!(.spillway.event_id, "e1")
        assert_eq!(.title, "x")
        assert!(!exists(.source_type))
      type: vrl
    extract_from: content_in_wikimedia
- inputs:
  - insert_at: content_budget
    source: '. = {"message": "m"}'
    type: vrl
  name: content_budget passes events within budget
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "m")
      type: vrl
    extract_from: content_budget
- inputs:
  - insert_at: content_hot
    source: '. = {"source_type": "kafka", "spillway": {"event_id": "e1", "produced_at":
      "2026-01-01T00:00:00.123456789Z", "feeder": "wikimedia"}}'
    type: vrl
  name: content_hot stamps sink time and pipeline latency
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(int!(.spillway.pipeline_latency_ms) > 0)
        assert_eq!(.spillway.event_id, "e1")
      type: vrl
    extract_from: content_hot
- inputs:
  - insert_at: content_hot
    source: '. = {"message": "m"}'
    type: vrl
  name: content_hot tolerates events without a produce timestamp
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(!exists(.spillway.pipeline_latency_ms))
      type: vrl
    extract_from: content_hot
- inputs:
  - insert_at: pod_logs
    source: '. = {"message": "hello", "stream": "stdout", "kubernetes": {"pod_namespace":
      "default", "pod_name": "app-0", "container_name": "app", "pod_node_name": "node-1",
      "pod_ip": "10.0.0.1", "pod_labels": {"app": "x"}}}'
    type: vrl
  name: pod_logs keeps the message and pod identity and drops other metadata
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "hello")
        assert_eq!(.stream, "stdout")
        assert_eq!(.namespace, "default")
        assert_eq!(.pod, "app-0")
        assert_eq!(.container, "app")
        assert_eq!(.node, "node-1")
        assert!(!exists(.kubernetes))
      type: vrl
    extract_from: pod_logs
- inputs:
  - insert_at: team_latency_events
    source: '. = {"spillway": {"team": "t", "feeder": "wikimedia", "pipeline_latency_ms":
      12}}'
    type: vrl
  name: team_latency_events passes events with a latency
  outputs:
  - conditions:
    - source: |
        assert_eq!(.spillway.pipeline_latency_ms, 12)
      type: vrl
    extract_from: team_latency_events
- inputs:
  - insert_at: team_latency_events
    source: '. = {"message": "pod log"}'
    type: vrl
  name: team_latency_events drops events without a latency
  no_outputs_from:
  - team_latency_events
- inputs:
  - insert_at: team_latency_metrics
    source: '. = {"spillway": {"team": "content", "pipeline_latency_ms": 12}}'
    type: vrl
  name: team_latency_metrics records latency as a histogram
  outputs:
  - conditions:
    - source: |
        assert_eq!(.name, "pipeline_latency_milliseconds")
        assert_eq!(.namespace, "spillway")
        assert_eq!(.tags.team, "content")
      type: vrl
    extract_from: team_latency_metrics
