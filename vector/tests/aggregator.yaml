# Generated by the Spillway renderer: `vector test` cases for every transform in the matching config. Do not edit.
tests:
- inputs:
  - insert_at: pod_logs
    source: '. = {"message": "hello", "stream": "stdout", "kubernetes": {"pod_namespace":
      "default", "pod_name": "app-0", "container_name": "app", "pod_node_name": "node-1",
      "pod_ip": "10.0.0.1", "pod_labels": {"app": "x"}}}'
    type: vrl
  name: pod_logs keeps the message and pod identity and drops other metadata
  outputs:
  - conditions:
    - source: |
        assert_eq!(.message, "hello")
        assert_eq!(.stream, "stdout")
        assert_eq!(.namespace, "default")
        assert_eq!(.pod, "app-0")
        assert_eq!(.container, "app")
        assert_eq!(.node, "node-1")
        assert!(!exists(.kubernetes))
      type: vrl
    extract_from: pod_logs
- inputs:
  - insert_at: stamp
    source: '. = {"source_type": "kafka", "spillway": {"event_id": "e1", "produced_at":
      "2026-01-01T00:00:00.123456789Z", "feeder": "wikimedia"}}'
    type: vrl
  name: stamp stamps sink time and pipeline latency
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(int!(.spillway.pipeline_latency_ms) > 0)
        assert_eq!(.spillway.event_id, "e1")
      type: vrl
    extract_from: stamp
- inputs:
  - insert_at: stamp
    source: '. = {"message": "m"}'
    type: vrl
  name: stamp tolerates events without a produce timestamp
  outputs:
  - conditions:
    - source: |
        assert!(is_timestamp(.spillway.sink_at))
        assert!(!exists(.spillway.pipeline_latency_ms))
      type: vrl
    extract_from: stamp
- inputs:
  - insert_at: latency_metrics
    source: '. = {"spillway": {"feeder": "wikimedia", "pipeline_latency_ms": 12}}'
    type: vrl
  name: latency_metrics records latency as a histogram
  outputs:
  - conditions:
    - source: |
        assert_eq!(.name, "pipeline_latency_milliseconds")
        assert_eq!(.namespace, "spillway")
        assert_eq!(.tags.feeder, "wikimedia")
      type: vrl
    extract_from: latency_metrics
