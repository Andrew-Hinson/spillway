# Spillway agent: pod logs on every node -> Kafka (spillway.pods) -> the aggregators.
data_dir: /vector-data-dir

# Same timestamp key as the aggregator (see vector/aggregator/vector.yaml), so
# the log time set here is the one the aggregator's Loki sink uses.
log_schema:
  timestamp_key: _timestamp

sources:
  # Tails /var/log/pods on this node and adds pod metadata from the API.
  # Pods labelled vector.dev/exclude=true (the agents themselves) are skipped,
  # so the agent never reads its own output.
  pods:
    type: kubernetes_logs
    self_node_name: ${VECTOR_SELF_NODE_NAME}

  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 15

sinks:
  # To the aggregators through Kafka, like feeder events. With no key, each
  # batch goes to a random partition of spillway.pods, so every aggregator in
  # the consumer group gets an even share of every namespace's logs, which is
  # what lets each enforce an even share of a team's budget (docs/adr/0005).
  # A gRPC connection straight to the aggregators' Service would pin each
  # agent to one pod.
  aggregator:
    type: kafka
    inputs: [pods]
    bootstrap_servers: spillway-kafka-bootstrap.kafka.svc:9092
    topic: spillway.pods
    encoding:
      codec: json
    # librdkafka queues up to 1 GiB in memory by default. Capped, with lz4,
    # the agent's heap levelled off at ~172 MiB in kind, against ~120 MiB
    # with no sink at all, and over 230 MiB and climbing without the cap. The
    # disk buffer above takes the backpressure instead.
    compression: lz4
    librdkafka_options:
      queue.buffering.max.kbytes: "16384"
      queue.buffering.max.messages: "10000"
    # Hold logs on the node while Kafka is unreachable. A batch leaves this
    # buffer only once Kafka has it. (kubernetes_logs can't take end-to-end
    # acknowledgements, so file checkpoints don't wait for delivery; this
    # buffer is what protects them.)
    buffer:
      type: disk
      max_size: 268435488 # 256 MiB, the minimum for a disk buffer
      when_full: block

  # Scraped by Prometheus (see the pod annotations in values.yaml).
  prometheus:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: 0.0.0.0:9598
