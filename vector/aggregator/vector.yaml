# Spillway aggregator: Kafka -> Loki, and pod logs from the agents -> Loki.
data_dir: /vector-data-dir

# Vector keeps each event's timestamp in a body field, "timestamp" by default.
# Upstream events have their own "timestamp" (Wikimedia's is Unix seconds), so
# Vector's goes under a reserved name instead. Sources fill it in (Kafka: the
# record time, i.e. the feeder's produced_at) and the Loki sink uses it as the
# entry time, then strips it from the stored line.
#
# Log namespacing would avoid the clash too, but in Vector 0.58 the timestamp
# it marks is lost when events pass through a disk buffer, and Loki then falls
# back to arrival time.
log_schema:
  timestamp_key: _timestamp

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  wikimedia:
    type: kafka
    bootstrap_servers: spillway-kafka-bootstrap.kafka.svc:9092
    group_id: spillway-aggregator
    topics: [wikimedia.recentchange]
    # A new consumer group starts from the oldest retained event; after that,
    # committed offsets are used so restarts lose nothing.
    auto_offset_reset: earliest
    decoding:
      codec: json
    # Don't add Kafka metadata to the event body: it would overwrite upstream
    # fields with the same names and inflate every stored line.
    key_field: ""
    topic_key: ""
    partition_key: ""
    offset_key: ""
    headers_key: ""
    # Export kafka_consumer_lag per partition, for the dashboard.
    metrics:
      topic_lag_metric: true

  # Pod logs forwarded by the agent DaemonSet (vector/agent/vector.yaml).
  agents:
    type: vector
    address: 0.0.0.0:6000

  # Vector's own metrics: events, bytes, errors and buffer sizes per component.
  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 15

transforms:
  # Last step before the sink: stamp the time the event leaves the pipeline,
  # so sink_at - produced_at is the feeder-to-sink latency.
  stamp:
    type: remap
    inputs: [wikimedia]
    source: |
      del(.source_type)
      sink_at = now()
      .spillway.sink_at = sink_at
      produced_at, err = parse_timestamp(.spillway.produced_at, "%+")
      if err == null {
        .spillway.pipeline_latency_ms = to_unix_timestamp(sink_at, unit: "milliseconds") -
          to_unix_timestamp(produced_at, unit: "milliseconds")
      }

  # Keep what's useful from a pod log line and drop the rest of the Kubernetes
  # metadata (pod labels, annotations, IPs, UIDs), which would otherwise
  # outweigh the message itself.
  pod_logs:
    type: remap
    inputs: [agents]
    source: |
      k = object(.kubernetes) ?? {}
      . = {
        "_timestamp": ._timestamp,
        "message": .message,
        "stream": .stream,
        "node": k.pod_node_name,
        "namespace": k.pod_namespace,
        "pod": k.pod_name,
        "container": k.container_name
      }

  # Feeder-to-sink latency as a histogram, so Prometheus can compute
  # quantiles without querying every log line in Loki.
  latency_metrics:
    type: log_to_metric
    inputs: [stamp]
    metrics:
      - type: histogram
        field: spillway.pipeline_latency_ms
        namespace: spillway
        name: pipeline_latency_milliseconds
        tags:
          feeder: "{{ spillway.feeder }}"

sinks:
  loki:
    type: loki
    inputs: [stamp]
    endpoint: http://loki.observability.svc:3100
    encoding:
      codec: json
    # Keep labels low-cardinality: Loki indexes streams by label set. Everything
    # else (wiki, title, user, ...) stays in the JSON line for `| json` queries.
    labels:
      feeder: "{{ spillway.feeder }}"
      type: "{{ type }}"
    out_of_order_action: accept
    batch:
      timeout_secs: 1
    # Survive Loki outages and aggregator restarts without dropping events.
    buffer:
      type: disk
      max_size: 1073741824 # 1 GiB
      when_full: block
    # Commit Kafka offsets only once events are safely in the disk buffer.
    acknowledgements:
      enabled: true

  # Pod logs go to their own sink and buffer, so a burst of pod logs never
  # queues behind (or ahead of) the feeder events and their latency numbers.
  loki_pods:
    type: loki
    inputs: [pod_logs]
    endpoint: http://loki.observability.svc:3100
    encoding:
      codec: json
    # Pod names change on every rollout, but a local cluster runs few enough
    # pods that the stream count stays small.
    labels:
      namespace: "{{ namespace }}"
      pod: "{{ pod }}"
      container: "{{ container }}"
    remove_label_fields: true
    out_of_order_action: accept
    batch:
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 536870912 # 512 MiB
      when_full: block
    # Answer an agent's batch only once it's in this buffer; until then the
    # agent keeps it in its own disk buffer.
    acknowledgements:
      enabled: true

  # Scraped by Prometheus (see the pod annotations in values.yaml).
  prometheus:
    type: prometheus_exporter
    inputs: [internal_metrics, latency_metrics]
    address: 0.0.0.0:9598
    # Milliseconds; fine-grained below 100ms, where steady-state latency sits.
    buckets: [1, 2.5, 5, 10, 15, 20, 30, 50, 75, 100, 150, 250, 500, 1000, 2500, 5000, 10000, 30000, 60000]
