# Helm values for the Vector aggregator (chart: vector, https://helm.vector.dev).
# The pipeline is rendered by the operator into the vector-aggregator-config
# ConfigMap; `make aggregator` seeds it with vector.yaml next to this file (the
# render with no LogPipelines, i.e. the M1 pipeline).
role: Aggregator
# Two replicas, so new config can run on one (the canary) while the other
# keeps the last good config. See docs/adr/0002.
replicas: 2
# Voluntary disruptions (node drains) take at most one aggregator at a time.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Each pod loads the config file its pod template's spillway.dev/config-suffix
# annotation names (vector<suffix>.yaml); without it, the bootstrap
# vector.yaml. The operator sets the annotation and the update partition;
# nothing here may set either, or Helm and the operator would conflict.
args:
  - --config
  - /etc/vector/vector$(SPILLWAY_CONFIG_SUFFIX).yaml
env:
  - name: SPILLWAY_CONFIG_SUFFIX
    valueFrom:
      fieldRef:
        fieldPath: metadata.annotations['spillway.dev/config-suffix']

existingConfigMaps:
  - vector-aggregator-config
dataDir: /vector-data-dir

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9598"

# Holds the disk buffers, so buffered events survive a restart: up to 3 GiB
# once teams route hot and cold (loki 1 GiB, loki_pods 512 MiB, hot_loki
# 1 GiB, cold_s3 512 MiB).
persistence:
  enabled: true
  size: 4Gi

service:
  ports:
    - name: api
      port: 8686
      protocol: TCP
      targetPort: 8686
    - name: metrics
      port: 9598
      protocol: TCP
      targetPort: 9598

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi
