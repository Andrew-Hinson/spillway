# Content: the Wikimedia edit stream from Kafka, with categorize events
# thinned to a tenth and log events to half, rate-capped hot, and kept whole
# in cold storage.
apiVersion: spillway.dev/v1alpha1
kind: LogPipeline
metadata:
  name: content
spec:
  team: content
  sources:
    - name: wikimedia
      kafka:
        topic: wikimedia.recentchange
  sampling:
    levelField: type
    keepPercent:
      categorize: 10
      log: 50
  budget:
    maxEventsPerSec: 100
  routing:
    cold: true
