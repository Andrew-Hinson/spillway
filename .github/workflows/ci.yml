name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint, generate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      # The CRD, RBAC and deepcopy code are generated from the Go types; fail
      # if they weren't regenerated after a change.
      - name: Check generated files are up to date
        run: |
          make generate
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: make test

  vector:
    name: Vector validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make vector-check
