# One chaos run's load generator (bench/m4_chaos.sh fills in the image tag,
# the namespace, RUN, STDOUT, STEPS and STEP_DURATION). With STDOUT=true it
# writes events as log lines, in chaos-pods, for the agent scenario.
apiVersion: v1
kind: Namespace
metadata:
  name: NAMESPACE
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-RUN
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: spillway
spec:
  backoffLimit: 0   # a restart would start the run's sequence again
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: spillway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: spillway/loadgen:dev
          imagePullPolicy: Never   # loaded into kind by bench/m4_chaos.sh
          args: ["-steps", "$(STEPS)", "-step-duration", "$(STEP_DURATION)", "-hold", "5s"]
          env:
            - name: KAFKA_BROKERS
              value: spillway-kafka-bootstrap.kafka.svc:9092
            - name: KAFKA_TOPIC
              value: chaos.load
            - name: RUN
              value: "RUN"
            - name: STDOUT
              value: "STDOUT"
            - name: STEPS
              value: "STEPS"
            - name: STEP_DURATION
              value: "STEP_DURATION"
            # The run's records, kept in the pod's status: with STDOUT the
            # log rotates too fast for `kubectl logs` to keep them.
            - name: SUMMARY
              value: /dev/termination-log
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
