---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: logpipelines.spillway.dev
spec:
  group: spillway.dev
  names:
    kind: LogPipeline
    listKind: LogPipelineList
    plural: logpipelines
    shortNames:
    - lp
    singular: logpipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.team
      name: Team
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LogPipeline is one team's log pipeline.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LogPipelineSpec is one team's pipeline: where its logs come from and the
              policy applied to them before they're stored.
            properties:
              budget:
                description: |-
                  Budget caps the team's event rate. Events over budget are counted and
                  dropped, never silently lost.
                properties:
                  maxEventsPerSec:
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                required:
                - maxEventsPerSec
                type: object
              redaction:
                description: Redaction masks PII before logs leave the aggregator.
                properties:
                  patterns:
                    items:
                      description: RedactionPattern is a built-in PII pattern.
                      enum:
                      - ssn
                      - email
                      - phone
                      - memberId
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - patterns
                type: object
              routing:
                default:
                  hot: true
                description: 'Routing picks the sinks: hot (Loki, queryable) and cold
                  (object storage).'
                properties:
                  cold:
                    default: false
                    description: Cold sends logs to object storage, partitioned by
                      team and date.
                    type: boolean
                  hot:
                    default: true
                    description: Hot sends logs to Loki, where they're queryable in
                      Grafana.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: at least one of hot or cold must be enabled
                  rule: (has(self.hot) && self.hot) || (has(self.cold) && self.cold)
              sampling:
                description: Sampling keeps a share of events per level; levels not
                  listed are kept.
                properties:
                  keepPercent:
                    additionalProperties:
                      description: Percent is a whole percentage from 0 to 100.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    description: |-
                      KeepPercent maps a level to the share of its events kept, e.g.
                      {debug: 1, info: 25}. 0 drops the level; 100 keeps all of it.
                    maxProperties: 16
                    minProperties: 1
                    type: object
                    x-kubernetes-validations:
                    - message: levels must be lowercase words of at most 32 characters
                      rule: self.all(k, k.matches('^[a-z][a-z0-9_-]{0,31}$'))
                  levelField:
                    default: level
                    description: |-
                      LevelField is the event field holding the log level, as a dot-separated
                      path such as "level" or "log.level".
                    maxLength: 256
                    pattern: ^[A-Za-z0-9_@-]+(\.[A-Za-z0-9_@-]+)*$
                    type: string
                required:
                - keepPercent
                type: object
              sources:
                description: Sources the team's logs are read from.
                items:
                  description: Source is one input. Exactly one of its source types
                    must be set.
                  properties:
                    kafka:
                      description: Kafka reads a topic, such as one a feeder produces
                        to.
                      properties:
                        topic:
                          description: Topic to consume.
                          maxLength: 249
                          pattern: ^[a-zA-Z0-9._-]+$
                          type: string
                      required:
                      - topic
                      type: object
                    kubernetes:
                      description: |-
                        Kubernetes reads the logs of pods in the given namespaces, collected by
                        the agent DaemonSet.
                      properties:
                        namespaces:
                          description: Namespaces whose pod logs belong to this pipeline.
                          items:
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - namespaces
                      type: object
                    name:
                      description: Name identifies the source within the pipeline.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of kafka or kubernetes must be set
                    rule: has(self.kafka) != has(self.kubernetes)
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              team:
                description: |-
                  Team owns the pipeline. It labels the team's logs and metrics and names
                  its cold-storage prefix, so it must be a DNS label.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - sources
            - team
            type: object
          status:
            description: LogPipelineStatus is the operator's view of the pipeline.
            properties:
              conditions:
                description: |-
                  Conditions: Ready is True once the aggregator runs config that includes
                  this pipeline. When False, its reason says why: RollingOut while the
                  aggregator restarts with new config, Invalid when the pipeline can't be
                  rendered (for example, its team or a namespace is already claimed), or
                  AggregatorNotFound.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
