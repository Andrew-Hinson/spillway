---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spillway-operator
rules:
- apiGroups:
  - spillway.dev
  resources:
  - logpipelines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - spillway.dev
  resources:
  - logpipelines/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spillway-operator
  namespace: vector
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - watch
