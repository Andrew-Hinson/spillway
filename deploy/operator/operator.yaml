# Spillway operator. The CRD (crd/) and its ClusterRole and Role (rbac/) are
# generated by `make generate`; this file binds them and runs the operator.
# The operator renders every LogPipeline into the aggregator's ConfigMap and
# rolls the aggregator when it changes. The image tag is
# filled in by `make operator` from a hash of the operator source.
apiVersion: v1
kind: Namespace
metadata:
  name: spillway-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spillway-operator
  namespace: spillway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spillway-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spillway-operator
subjects:
  - kind: ServiceAccount
    name: spillway-operator
    namespace: spillway-system
---
# The generated Role: the aggregator's ConfigMap and StatefulSet, in its
# namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spillway-operator
  namespace: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spillway-operator
subjects:
  - kind: ServiceAccount
    name: spillway-operator
    namespace: spillway-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spillway-operator
  namespace: spillway-system
  labels:
    app.kubernetes.io/name: spillway-operator
    app.kubernetes.io/part-of: spillway
spec:
  # One replica, so no leader election (and no Lease RBAC) is needed yet.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spillway-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spillway-operator
        app.kubernetes.io/part-of: spillway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: spillway-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: spillway/operator:dev
          imagePullPolicy: Never   # loaded into kind by `make operator`
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
