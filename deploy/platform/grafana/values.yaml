# Grafana with Loki provisioned as the default datasource. Dashboards and
# settings live on a persistent volume. The admin password is generated by the
# chart; `make grafana-ui` prints it.
persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: true
