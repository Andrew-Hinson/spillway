# Grafana with Loki (default) and Prometheus provisioned as datasources. Dashboards and
# settings live on a persistent volume. The admin password is generated by the
# chart; `make grafana-ui` prints it.
persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: true
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        jsonData:
          timeInterval: 15s

# Dashboards in the repo's dashboards/ directory, loaded from a ConfigMap that
# `make grafana` creates. Grafana re-reads the files periodically, so edits
# show up without a restart.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: spillway
        folder: Spillway
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/spillway
dashboardsConfigMaps:
  spillway: grafana-dashboards
