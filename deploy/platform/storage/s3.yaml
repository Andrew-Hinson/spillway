# Cold storage for local development: Silo, a maintained fork of the MinIO
# server (MinIO no longer publishes community images; docs/adr/0006), in
# single-drive mode on a persistent volume. In the cloud, the aggregators
# write to S3 itself (M4.3). Credentials are generated by `make storage` into
# the cold-storage Secret, in this namespace and in vector.
apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
  namespace: storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: storage
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/part-of: spillway
spec:
  replicas: 1
  # One writer per volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
    spec:
      containers:
        - name: silo
          image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          args: ["server", "/data"]
          env:
            # Silo keeps MinIO's variable names.
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: cold-storage, key: AWS_ACCESS_KEY_ID}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: cold-storage, key: AWS_SECRET_ACCESS_KEY}}
            - name: MINIO_BROWSER   # no web console
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3-data
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: storage
spec:
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Creates the cold bucket. Safe to rerun: an existing bucket is left alone.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: storage
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.37.12
          command: ["sh", "-c"]
          args:
            - aws --endpoint-url http://s3.storage.svc:9000 s3api head-bucket --bucket spillway-cold 2>/dev/null ||
              aws --endpoint-url http://s3.storage.svc:9000 s3 mb s3://spillway-cold
          envFrom:
            - secretRef: {name: cold-storage}
          env:
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
