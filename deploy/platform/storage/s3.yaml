# Cold storage for local development: versitygw, an S3 gateway that serves a
# directory on a persistent volume as buckets (docs/adr/0006). The plan named
# MinIO, but its images are no longer published. In the cloud, the aggregators
# write to S3 itself (M4.3). Credentials are generated by `make storage` into
# the cold-storage Secret, in this namespace and in vector.
apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
  namespace: storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: storage
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/part-of: spillway
spec:
  replicas: 1
  # One writer per volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
    spec:
      containers:
        - name: versitygw
          image: versity/versitygw:v1.8.0
          args: ["posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: cold-storage, key: AWS_ACCESS_KEY_ID}}
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: cold-storage, key: AWS_SECRET_ACCESS_KEY}}
          ports:
            - name: s3
              containerPort: 7070
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3-data
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: storage
spec:
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: s3
      port: 7070
      targetPort: s3
---
# Creates the cold bucket. Safe to rerun: an existing bucket is left alone.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: storage
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.37.12
          command: ["sh", "-c"]
          args:
            - aws --endpoint-url http://s3.storage.svc:7070 s3api head-bucket --bucket spillway-cold 2>/dev/null ||
              aws --endpoint-url http://s3.storage.svc:7070 s3 mb s3://spillway-cold
          envFrom:
            - secretRef: {name: cold-storage}
          env:
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
