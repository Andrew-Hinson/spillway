# Monolithic Loki for local development: one pod, filesystem storage on a
# persistent volume, no gateway, caches, canary or MinIO.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    # Loki's defaults (4 MB/s per tenant, 3 MB/s per stream) cap a team's hot
    # path at about 2,700 events/s: hot_loki makes one stream per team and
    # source. Spillway's per-team budgets are the rate control, so this
    # single-tenant Loki takes what the aggregators send
    # (docs/results/m4.1-benchmark.md).
    ingestion_rate_mb: 64
    ingestion_burst_size_mb: 128
    per_stream_rate_limit: 64MB
    per_stream_rate_limit_burst: 128MB
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Components of the scalable modes; unused in Monolithic mode.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
